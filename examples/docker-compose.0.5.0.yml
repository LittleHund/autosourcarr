# AutoSourcarr 0.5.0: the smallest Compose (ARC-5).
#
# Settings live in /config/config.json and are edited in the web UI (Settings, or the setup
# wizard on first start). Secrets in it are encrypted with /config/config.key: back up both.
#
# Coming from 0.4.x: point /config at your existing config folder. On the first start the
# old autosourcarr.env (and source-host.env) is converted once into config.json; the env
# files stay where they are and an identical copy goes to /config/backups/. After that,
# remove the old "env_file:" line from your Compose. Settings you save in the app still win
# over it, but every other setting would keep the old file's value.
#
# Every setting can also be set here as an environment variable with the same name. Such a
# variable wins over the default and over config.json values you never changed in the app;
# a value you save in the app wins over it (use "Use default" on the Settings page to hand a
# setting back to Compose). Folders and identities (DATA_DIR, DATABASE_DIR, SOURCE_ENGINE_UID/GID,
# ...) can only be set here. The full list with defaults is in docs/settings.md.
#
# The image is published from conversion phase 13; until then this file is a preview.
services:
  autosourcarr:
    image: ghcr.io/littlehund/autosourcarr:0.5.0
    container_name: autosourcarr
    restart: unless-stopped
    ports:
      - "8282:8282"
    volumes:
      - ./config:/config
      - ./data:/data
    environment:
      # Optional (see docs/settings.md, columns "Compose" and "Compose only"):
      TZ: Europe/Amsterdam   # a time zone saved in the setup wizard wins over this
      # SOURCE_ENGINE_UID: "568"
      # SOURCE_ENGINE_GID: "568"
      # DATABASE_DIR: /database
    cap_drop: [ALL]
    stop_grace_period: 90s
