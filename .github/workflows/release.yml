name: release

# Phase 13 (PIPE-1..9, PERF-7): one pipeline that builds the 0.5.0 image and the reader extension, boots the image,
# measures its boot time, browser-checks it and publishes the compatibility list. Runs only by hand or on a version
# tag, never on every push.
#
# Publishing to ghcr.io (hard rule 15) is an OWNER GATE: the push job runs only when the run was started by hand
# with "publish" ticked (default off) AND the "release" environment approves it (configure the environment with the
# owner as required reviewer in the repository settings). Never start it without the owner's go. Tag pushes never
# publish. The publish job pushes the exact image this run built and tested (saved as an artifact, image ID checked);
# it never rebuilds.
#
# Owner note (PIPE-3 "pins updated by the pipeline"): the scheduled pin refresh below stays DISABLED on purpose. The
# owner does not want extra GitHub runs or notification mail. Run `python3 scripts/update-pins.py` by hand before a
# release instead: it refreshes image digests (content addresses from the registries) and only REPORTS upstream
# changes of downloaded tool hashes, which stay pinned in the repository until a person updates them.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Push the image to ghcr.io/littlehund/autosourcarr (owner only; also needs the release environment approval)"
        type: boolean
        default: false
      force_playwright:
        description: "Run the browser checks even when no UI file changed since the previous release tag"
        type: boolean
        default: false
      accept_screenshot_changes:
        description: "The changed pages in the screenshot diff were reviewed and are intended (lifts the page limit)"
        type: boolean
        default: false
  push:
    tags: ["v*"]
  # PIPE-3 pin refresh: scripts/update-pins.py on a schedule, opening its diff for review. Disabled by the owner's
  # choice (no extra runs/notifications); see the owner note above. Do not enable without the owner.
  # schedule:
  #   - cron: "17 4 * * 1"

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/littlehund/autosourcarr
  # The official Playwright image (PIPE-5), same version as package-lock.json, pinned by digest.
  PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.64.1-jammy@sha256:a3966b653e8d48a30901889081b616307fca73e0d843a117fadf6609397dac38
  BOOT_PORT: "18282"
  # PIPE-5 gate: more changed (or vanished) pages than this stop the release until reviewed
  # (rerun with accept_screenshot_changes after checking the diff in the job summary and the release-report artifact).
  SCREENSHOT_MAX_CHANGED: "0"

jobs:
  image:
    name: Image build, boot time and browser checks
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      version: ${{ steps.meta.outputs.version }}
      image_id: ${{ steps.saved.outputs.image_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Version, previous release and changed areas
        id: meta
        run: |
          version=$(tr -d '\r\n' < VERSION)
          previous=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)
          ui=true
          if [ -n "$previous" ] && git diff --quiet "$previous" HEAD -- autosourcarr/app/static tests/e2e playwright.config.js \
               scripts/bundle-ui.mjs package-lock.json; then ui=false; fi
          [ "${{ inputs.force_playwright }}" = true ] && ui=true
          {
            echo "version=$version"; echo "previous=$previous"; echo "ui_changed=$ui"
          } >> "$GITHUB_OUTPUT"
          echo "version $version, previous release ${previous:-none}, UI changed: $ui"

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - name: Gradle cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-release-${{ hashFiles('source-host/**', 'scripts/build-source-host.sh', 'extension/module/**', 'extension/keiyoushi-default.lock', 'scripts/build-reader-extension.sh') }}
          restore-keys: gradle-release-

      # The Kotlin source host is rebuilt only when its sources or build script change (cache key on their hashes).
      - name: Source host jar cache
        id: host-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/source-host-out
          key: source-host-jar-${{ hashFiles('source-host/**', 'scripts/build-source-host.sh') }}
      - name: Build the source host (Suwayomi v2.4.2366 checkout)
        if: steps.host-cache.outputs.cache-hit != 'true'
        run: |
          bash scripts/build-source-host.sh
          mkdir -p .build/source-host-out
          cp .build/autosourcarr-source-host.jar .build/source-host-out/

      - name: Reader extension repository (READ-1)
        env:
          AUTOSOURCARR_EXT_KEYSTORE_B64: ${{ secrets.AUTOSOURCARR_EXT_KEYSTORE_B64 }}
          AUTOSOURCARR_EXT_KEYSTORE_PASSWORD: ${{ secrets.AUTOSOURCARR_EXT_KEYSTORE_PASSWORD }}
          AUTOSOURCARR_EXT_KEY_ALIAS: ${{ secrets.AUTOSOURCARR_EXT_KEY_ALIAS }}
          AUTOSOURCARR_EXT_KEY_PASSWORD: ${{ secrets.AUTOSOURCARR_EXT_KEY_PASSWORD }}
        run: |
          bash scripts/build-reader-extension.sh .build/reader-extension
          python3 -c "import json;b=json.load(open('.build/reader-extension/build.json'));print('signed_for_release=' + str(b['signed_for_release']).lower());print('fingerprint=' + b['signing_fingerprint'])" | tee reader-extension.txt
          grep -q 'signed_for_release=true' reader-extension.txt || echo "::warning::UNSIGNED-FOR-RELEASE: the reader extension is signed with a throwaway key; add the AUTOSOURCARR_EXT_* secrets before releasing."

      - name: Compatibility list (PIPE-4)
        run: |
          python3 scripts/print-compatibility.py --check
          python3 scripts/print-compatibility.py > "compatibility-${{ steps.meta.outputs.version }}.json"
      - name: Mihon backup-format watch (PIPE-9, report only)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 scripts/mihon-backup-watch.py --fixtures > mihon-backup-watch.txt 2>&1; code=$?
          echo "exit=$code" >> mihon-backup-watch.txt; cat mihon-backup-watch.txt
          [ "$code" = 0 ] || echo "::warning::Mihon backup-format watch reported a change, a sample gap or a fetch problem (exit $code); see mihon-backup-watch.txt."

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Build the test runner (benchmark and Linux runtime tests)
        run: |
          dotnet restore AutoSourcarr.slnx --locked-mode
          dotnet build tests/AutoSourcarr.Tests -c Release --no-restore
      # SRC-5: the source host sandbox proof, as the (non-root) runner user.
      - name: Source host sandbox check
        id: sandbox
        run: |
          set +e
          bash scripts/source-host-sandbox-check.sh > source-host-sandbox.txt 2>&1; code=$?
          cat source-host-sandbox.txt; echo "code=$code" >> "$GITHUB_OUTPUT"; exit 0
      # The Linux-only C# tests against the native binaries built here with the image's hardened flags.
      - name: Linux runtime tests (repair isolation, source host sandbox)
        id: linux
        run: |
          set +e
          bin=$RUNNER_TEMP/native; mkdir -p "$bin"
          flags="-O2 -Wall -Werror -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=3 -fstack-protector-strong -fstack-clash-protection -fcf-protection=full -fPIE -static-pie -Wl,-z,relro,-z,now,-z,noexecstack"
          gcc $flags -o "$bin/repair-runner" native/repair-runner.c && gcc $flags -o "$bin/source-host-sandbox" native/source-host-sandbox.c; built=$?
          code=$built
          if [ "$built" = 0 ]; then
            AUTOSOURCARR_REPAIR_RUNNER=$bin/repair-runner AUTOSOURCARR_SOURCE_HOST_SANDBOX=$bin/source-host-sandbox \
              dotnet run --project tests/AutoSourcarr.Tests -c Release --no-build -- \
              --filter "repair isolation (linux)" --filter "source host sandbox (linux)" > linux-runtime.txt 2>&1; code=$?
            grep -q '^SKIP' linux-runtime.txt && { echo "::warning::A Linux runtime test was skipped (see linux-runtime.txt)."; }
          else echo "native build failed" > linux-runtime.txt; fi
          cat linux-runtime.txt; echo "code=$code" >> "$GITHUB_OUTPUT"; exit 0
      # PIPE-8 / PERF-2: large-library page load and job queue under load, against the budgets in PerformanceBenchmark.
      - name: Performance benchmark gate
        id: benchmark
        run: |
          set +e
          dotnet run --project tests/AutoSourcarr.Tests -c Release --no-build -- --benchmark benchmark.json --gate > benchmark.txt 2>&1; code=$?
          cat benchmark.txt; echo "code=$code" >> "$GITHUB_OUTPUT"; exit 0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      # Layer cache in the GitHub cache: the NuGet restore layer is reused while the lock files are unchanged, the apt
      # layer is rebuilt on every release on purpose (fresh OS packages, PIPE-2).
      - name: Build the image (no push)
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile
          build-contexts: |
            source-host=.build/source-host-out
            reader-extension=.build/reader-extension
          # PACKAGES_EPOCH: a new value per run, so the apt-get upgrade layer always reruns (PIPE-2 fresh packages).
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
            PACKAGES_EPOCH=${{ github.run_id }}-${{ github.run_attempt }}
          platforms: linux/amd64
          load: true
          push: false
          tags: autosourcarr:ci
          cache-from: type=gha,scope=autosourcarr-0.5
          cache-to: type=gha,scope=autosourcarr-0.5,mode=max

      # The tested image is what gets published: its image ID (config digest) is recorded here, and when publishing was
      # requested the image itself is saved as an artifact for the publish job (no rebuild).
      - name: Record the tested image
        id: saved
        run: |
          id=$(docker image inspect -f '{{.Id}}' autosourcarr:ci)
          echo "image_id=$id" >> "$GITHUB_OUTPUT"
          echo "tested image $id" | tee image-id.txt
      - name: Save the tested image (only when publishing was requested)
        if: github.event_name == 'workflow_dispatch' && inputs.publish == true
        run: docker save autosourcarr:ci | zstd -T0 -10 -o autosourcarr-image.tar.zst

      - name: Image contents
        run: |
          docker run --rm --entrypoint cat autosourcarr:ci /opt/autosourcarr-image-packages.txt > image-packages.txt
          docker run --rm --entrypoint sh autosourcarr:ci -c 'cat /opt/source-host/aot/status.txt; cat /opt/source-jre/autosourcarr-modules.txt; ls -l /opt/autosourcarr-native; id' | tee image-contents.txt

      # Also the runtime check: /api/v1/health source_sandbox + repair_isolation, and the WebView (JCEF) reaching
      # "ready" inside the source host sandbox. Exit 75 (the app's restart request) is followed like Compose's
      # restart: unless-stopped; the restart count is in boot-time.txt.
      - name: Boot time and runtime check (PERF-7 budget 5 min, target 1 min; SRC-5)
        id: boot
        run: |
          set +e
          bash scripts/image-boot-check.sh autosourcarr:ci boot-time.txt "$BOOT_PORT" autosourcarr-boot; code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          grep -q 'result=pass-budget' boot-time.txt && echo "::warning::Boot is within the 5-minute budget but over the 1-minute target."
          grep -q '^restarts=0' boot-time.txt || echo "::warning::The container restarted during boot (see restarts/last_exit_code in boot-time.txt; 75 = the app's restart request)."
          exit 0

      - name: Contrast gate (palette table, every theme)
        id: contrast
        run: |
          set +e
          node autosourcarr/tests/ui_v050_theme_contrast.js > contrast.txt 2>&1; code=$?
          cat contrast.txt; echo "code=$code" >> "$GITHUB_OUTPUT"; exit 0

      - name: Browser checks against the running image (PIPE-5)
        id: playwright
        if: steps.meta.outputs.ui_changed == 'true' && (steps.boot.outputs.code == '0' || steps.boot.outputs.code == '3')
        run: |
          set +e
          node scripts/image-e2e-prepare.mjs "http://127.0.0.1:$BOOT_PORT" tests/e2e/fixtures/owner.json; prep=$?
          code=$prep
          if [ "$prep" = 0 ]; then
            docker run --rm --network host --ipc=host -v "$PWD:/work" -w /work -e CI=1 \
              -e E2E_BASE_URL="http://127.0.0.1:$BOOT_PORT" -e E2E_SCREENSHOT_DIR=/work/screenshots \
              -e E2E_JSON=/work/test-results/playwright-image.json "$PLAYWRIGHT_IMAGE" \
              bash -c 'npm ci --no-audit --no-fund && npx playwright test' > playwright-image.log 2>&1; code=$?
            sudo chown -R "$(id -u):$(id -g)" . 2>/dev/null || true
            node scripts/playwright-summary.mjs test-results/playwright-image.json > playwright-image.txt 2>&1
            cat playwright-image.txt; tail -c 20000 playwright-image.log
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"; exit 0

      - name: Screenshot diff against the previous release
        id: diff
        if: steps.playwright.outputs.code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set +e -o pipefail
          mkdir -p previous-screenshots
          # Baseline = the newest successful run on a v* tag, else on the default branch; never another manual run.
          runs=$(gh run list --workflow release.yml --status success --limit 50 --json databaseId,headBranch,event \
            -q '[.[] | select(.event == "push" and (.headBranch | startswith("v")))] + [.[] | select(.headBranch == env.DEFAULT_BRANCH)] | .[].databaseId')
          for id in $runs; do
            [ "$id" = "${{ github.run_id }}" ] && continue
            gh run download "$id" -n ui-screenshots -D previous-screenshots 2>/dev/null && { echo "previous screenshots: run $id"; break; }
          done
          limit="$SCREENSHOT_MAX_CHANGED"
          [ "${{ inputs.accept_screenshot_changes }}" = true ] && limit=1000000
          node scripts/screenshot-diff.mjs previous-screenshots screenshots --out screenshot-diff \
            --max-changed "$limit" --summary "$GITHUB_STEP_SUMMARY" 2>&1 | tee screenshot-diff.txt; code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"; exit 0

      - name: Stop the image
        if: always()
        run: docker rm -f autosourcarr-boot > /dev/null 2>&1 || true

      - name: Upload screenshots (baseline of the next release)
        if: steps.playwright.outputs.code == '0' && steps.diff.outputs.code == '0'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-screenshots
          path: screenshots/
          if-no-files-found: warn
          retention-days: 90
      - name: Upload the compatibility list
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compatibility-list
          path: compatibility-${{ steps.meta.outputs.version }}.json
          retention-days: 90
      - name: Upload the reader extension repository
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reader-extension
          path: .build/reader-extension/
          retention-days: 30
      - name: Upload the release report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-report
          path: |
            boot-time.txt
            boot-time-container.log
            boot-time-health.json
            boot-time-runtime.log
            source-host-sandbox.txt
            linux-runtime.txt
            benchmark.json
            benchmark.txt
            contrast.txt
            image-packages.txt
            image-contents.txt
            reader-extension.txt
            mihon-backup-watch.txt
            playwright-image.txt
            screenshot-diff.txt
            screenshot-diff/
            playwright-report/
            image-id.txt
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload the tested image (publish runs only)
        if: github.event_name == 'workflow_dispatch' && inputs.publish == true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-image
          path: autosourcarr-image.tar.zst
          compression-level: 0
          retention-days: 3

      - name: Release gates (boot budget, sandbox, benchmark, contrast, layout)
        run: |
          fail=0
          case "${{ steps.boot.outputs.code }}" in
            0) ;;
            3) echo "::error::Runtime check failed (see boot-time.txt): the source host is not Landlock-sandboxed or its WebView did not reach ready."; fail=1 ;;
            *) echo "::error::Boot-time gate failed (see boot-time.txt): ready not reached within 5 minutes."; fail=1 ;;
          esac
          [ "${{ steps.sandbox.outputs.code }}" = 0 ] || { echo "::error::Source host sandbox check failed (see source-host-sandbox.txt)."; fail=1; }
          [ "${{ steps.linux.outputs.code }}" = 0 ] || { echo "::error::Linux runtime tests failed (see linux-runtime.txt)."; fail=1; }
          [ "${{ steps.benchmark.outputs.code }}" = 0 ] || { echo "::error::Performance benchmark over budget (see benchmark.txt)."; fail=1; }
          [ "${{ steps.contrast.outputs.code }}" = 0 ] || { echo "::error::Contrast gate failed (see contrast.txt)."; fail=1; }
          if [ "${{ steps.meta.outputs.ui_changed }}" = true ]; then
            [ "${{ steps.playwright.outputs.code }}" = 0 ] || { echo "::error::Browser/layout checks failed or did not run (see playwright-image.txt)."; fail=1; }
            case "${{ steps.diff.outputs.code }}" in
              0) ;;
              4) echo "::error::Screenshot diff: more pages changed than SCREENSHOT_MAX_CHANGED; review the job summary, then rerun with accept_screenshot_changes."; fail=1 ;;
              *) echo "::error::Screenshot diff failed or did not run (see screenshot-diff.txt)."; fail=1 ;;
            esac
          else
            echo "No UI file changed since ${{ steps.meta.outputs.previous }}: browser checks skipped."
          fi
          # A real release (a tag push, or a run with publish ticked) needs the dated CHANGELOG section; a rehearsal run only warns.
          version=$(tr -d '\r\n' < VERSION)
          if ! grep -qE "^## ${version//./[.]} - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            if [ "${{ github.event_name }}" = push ] || [ "${{ inputs.publish }}" = true ]; then
              echo "::error::CHANGELOG.md has no dated '## ${version} - YYYY-MM-DD' section (the date is still a placeholder)."; fail=1
            else
              echo "::warning::CHANGELOG.md still has the YYYY-MM-DD placeholder; set the date before the release run."
            fi
          fi
          exit $fail

  publish:
    name: Publish to ghcr.io (owner gate)
    needs: image
    # Hard rule 15: only a manual run with publish ticked, and only after the release environment is approved.
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - name: The tested image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tested-image
      - name: Load it and check it is the tested image
        env:
          TESTED_ID: ${{ needs.image.outputs.image_id }}
        run: |
          set -euo pipefail
          zstd -dc autosourcarr-image.tar.zst | docker load
          id=$(docker image inspect -f '{{.Id}}' autosourcarr:ci)
          echo "loaded $id, tested $TESTED_ID"
          [ -n "$TESTED_ID" ] && [ "$id" = "$TESTED_ID" ] || { echo "::error::The image artifact is not the tested image."; exit 1; }
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push the tested image
        env:
          VERSION: ${{ needs.image.outputs.version }}
          TESTED_ID: ${{ needs.image.outputs.image_id }}
        run: |
          set -euo pipefail
          for tag in "$VERSION" latest; do
            docker tag autosourcarr:ci "$IMAGE:$tag"
            [ "$(docker image inspect -f '{{.Id}}' "$IMAGE:$tag")" = "$TESTED_ID" ] || { echo "::error::Tag $tag does not point at the tested image."; exit 1; }
            docker push "$IMAGE:$tag"
          done
          digest=$(docker image inspect -f '{{index .RepoDigests 0}}' "$IMAGE:$VERSION")
          { echo "### Published"; echo; echo "- image ID (tested): \`$TESTED_ID\`"; echo "- registry digest: \`$digest\`"; } >> "$GITHUB_STEP_SUMMARY"
          echo "published $digest (image ID $TESTED_ID)"
