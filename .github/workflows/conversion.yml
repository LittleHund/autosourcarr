name: conversion

# Phase 0 stage 5 skeleton. Runs on the conversion branch only; main keeps the Python release flow.
on:
  push:
    branches: [conversion]
  pull_request:
    branches: [conversion]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conversion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET build and tests (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        # Not used before phase 2 (ARC-9); present so the data-layer phase starts with a green service.
        image: postgres:17-alpine
        env:
          POSTGRES_USER: autosourcarr
          POSTGRES_PASSWORD: autosourcarr
          POSTGRES_DB: autosourcarr
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U autosourcarr"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      AUTOSOURCARR_TEST_POSTGRES: postgres://autosourcarr:autosourcarr@localhost:5432/autosourcarr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json   # 10.0.402 + latestPatch -> 10.0.403 (.NET 10.0.14)
      - name: Restore
        run: dotnet restore AutoSourcarr.slnx --locked-mode   # lock files are committed; drift fails here
      - name: Build (warnings are errors)
        run: dotnet build AutoSourcarr.slnx -c Release --no-restore
      - name: Test
        env:
          AUTOSOURCARR_TEST_ROOT: ${{ runner.temp }}/autosourcarr-tests
        run: dotnet run --project tests/AutoSourcarr.Tests -c Release --no-build
      - name: OpenAPI document and UI client are current
        # The typed UI client is generated from the API; a stale committed copy fails the build.
        run: |
          dotnet run --project tests/AutoSourcarr.Tests -c Release --no-build -- --write-openapi api/openapi.json
          git diff --exit-code -- api/openapi.json || { echo "::error file=api/openapi.json::openapi.json is out of date; regenerate it and commit."; exit 1; }
          node scripts/generate-api-client.mjs --check
      - name: Lock files changed?
        # packages.lock.json files are regenerated by restore; commit them when they change.
        run: git status --porcelain -- '**/packages.lock.json' | tee lockfiles.txt; test ! -s lockfiles.txt || echo "::warning::packages.lock.json changed; commit the regenerated lock files."

  python-baseline:
    name: Python 0.4.x checks (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test requirements
        run: python -m pip install -r autosourcarr/requirements-test.txt
      - name: Regression suite against the recorded baseline
        run: bash scripts/ci-pytest.sh
      - name: Project checks (syntax, compose, templates, UI suites, bundled tools)
        env:
          AUTOSOURCARR_SKIP_PYTEST: "1"
        run: |
          mkdir -p runtime-config
          cp config/autosourcarr.env.example runtime-config/autosourcarr.env
          bash scripts/check-project.sh
