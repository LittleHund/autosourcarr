name: probe

# Scratch compile/test probe for the ci-probe branch only. Every step tolerates failure and the job
# always succeeds (so GitHub sends no failure mail); results are committed back under probe/.
on:
  push:
    branches: [ci-probe]
    paths-ignore: ['probe/**']

permissions:
  contents: write

concurrency:
  group: probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: autosourcarr
          POSTGRES_PASSWORD: autosourcarr
          POSTGRES_DB: autosourcarr
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U autosourcarr"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      AUTOSOURCARR_TEST_POSTGRES: postgres://autosourcarr:autosourcarr@localhost:5432/autosourcarr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-source-host-${{ hashFiles('source-host/build.gradle.kts', 'scripts/build-source-host.sh') }}
          restore-keys: gradle-source-host-
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Probe
        continue-on-error: true
        env:
          AUTOSOURCARR_TEST_ROOT: ${{ runner.temp }}/autosourcarr-tests
        run: |
          set +e
          mkdir -p probe
          sha=$(git rev-parse HEAD)
          dotnet restore AutoSourcarr.slnx > probe/restore.log 2>&1; r=$?
          dotnet build AutoSourcarr.slnx -c Release --no-restore > probe/build.log 2>&1; b=$?
          grep -E "error [A-Z]+[0-9]+|warning [A-Z]+[0-9]+" probe/build.log | sed 's#/home/runner/work/autosourcarr/autosourcarr/##' | sort -u > probe/build-errors.txt
          if grep -q AD0001 probe/build.log; then
            dotnet build src/AutoSourcarr.Api/AutoSourcarr.Api.csproj -c Release --no-restore -p:ErrorLog=$PWD/probe/api-analyzer.sarif -p:ReportAnalyzer=true > probe/api-analyzer.log 2>&1
            python3 -c "import json,sys;d=json.load(open('probe/api-analyzer.sarif'));[print(r.get('ruleId'),json.dumps(r.get('message'))[:6000]) for run in d['runs'] for r in run.get('results',[]) if r.get('ruleId')=='AD0001']" > probe/ad0001.txt 2>&1
          fi
          t=skipped; o=skipped; c=skipped
          if [ $b -eq 0 ]; then
            command -v nginx >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q nginx-light; } > probe/nginx.log 2>&1
            nginx -v >> probe/nginx.log 2>&1
            # Phase 10: the CBZ pipeline test copies its library here for the Kavita check below.
            LIBRARY_EXPORT=$RUNNER_TEMP/library-export AUTOSOURCARR_REQUIRE_NGINX=1 dotnet run --project tests/AutoSourcarr.Tests -c Release --no-build > probe/test.log 2>&1; t=$?
            grep -E "^FAIL " -A 25 probe/test.log > probe/test-failures.txt
            tail -c 2000 probe/test.log | grep -o '"total":[0-9]*,"passed":[0-9]*,"failed":[0-9]*' > probe/test-summary.txt
            dotnet run --project tests/AutoSourcarr.Tests -c Release --no-build -- --write-openapi api/openapi.json > probe/openapi.log 2>&1; o=$?
            [ $o -eq 0 ] && { node scripts/generate-api-client.mjs >> probe/openapi.log 2>&1; c=$?; }
            dotnet run --project tests/AutoSourcarr.Tests -c Release --no-build -- --write-settings-docs docs/settings.md >> probe/openapi.log 2>&1
          fi
          # Phase 11: Web UI bundle and Playwright at phone/tablet/desktop in every theme.
          pw=skipped; pwb=skipped; ub=skipped
          if [ $b -eq 0 ]; then
            { npm ci --no-audit --no-fund && npx playwright install --with-deps chromium; } > probe/playwright-install.log 2>&1
            node scripts/bundle-ui.mjs --check > probe/bundle-ui.txt 2>&1 && node scripts/bundle-ui.mjs >> probe/bundle-ui.txt 2>&1; ub=$?
            CI=1 E2E_JSON=test-results/playwright.json timeout 2700 npx playwright test > probe/playwright.log 2>&1; pw=$?
            node scripts/playwright-summary.mjs test-results/playwright.json > probe/playwright.txt 2>&1
            if [ "$ub" = 0 ]; then
              CI=1 E2E_BUNDLE=1 E2E_JSON=test-results/playwright-bundle.json \
                timeout 2700 npx playwright test > probe/playwright-bundle.log 2>&1; pwb=$?
              node scripts/playwright-summary.mjs test-results/playwright-bundle.json > probe/playwright-bundle.txt 2>&1
            fi
            tail -c 30000 probe/playwright.log > probe/playwright.tail.log; rm -f probe/playwright.log
            tail -c 10000 probe/playwright-bundle.log > probe/playwright-bundle.tail.log 2>/dev/null; rm -f probe/playwright-bundle.log
            tail -c 4000 probe/playwright-install.log > probe/playwright-install.tail.log; rm -f probe/playwright-install.log
          fi
          # CHAP-7 (phase 10): the library the pipeline test wrote opens in Kavita (1 series, 2 chapters).
          kv=skipped
          if [ -d "$RUNNER_TEMP/library-export" ]; then
            timeout 600 bash scripts/kavita-check.sh "$RUNNER_TEMP/library-export" 1 2 > probe/kavita-check.txt 2>&1; kv=$?
          fi
          # READ-1 (phase 10): the prebuilt reader extension (Keiyoushi build); its JAR feeds the two-server source-host test.
          rx=skipped
          if [ -f scripts/build-reader-extension.sh ]; then
            timeout 1500 bash scripts/build-reader-extension.sh .build/reader-extension > probe/reader-extension-build.log 2>&1; rx=$?
            tail -80 probe/reader-extension-build.log > probe/reader-extension-build.tail.log; rm -f probe/reader-extension-build.log
            find .build/reader-extension -maxdepth 2 -type f | sort > probe/reader-extension-files.txt 2>/dev/null
            reader_jar=$(find .build/reader-extension/jar -name '*.jar' 2>/dev/null | head -1)
            [ -n "$reader_jar" ] && export AUTOSOURCARR_TEST_READER_EXTENSION_JAR=$PWD/$reader_jar
          fi
          # Source host (phase 4): build in a pinned Suwayomi checkout, start it, check real extensions.
          h=skipped; hc=skipped
          if [ -d source-host ]; then
            bash scripts/build-source-host.sh > probe/source-host-build.log 2>&1; h=$?
            tail -60 probe/source-host-build.log | grep -E "^e:|error:|FAIL|BUILD" > probe/source-host-errors.txt || true
            if [ $h -eq 0 ]; then
              export SOURCE_HOST_DATA=$RUNNER_TEMP/source-host-data SOURCE_HOST_PORT=4567
              command -v xvfb-run >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q xvfb libnss3 libatk-bridge2.0-0 libgbm1 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libasound2t64 libxss1 libgtk-3-0t64; } > probe/xvfb.log 2>&1
              python3 scripts/fake-cloudflare.py 8899 &
              GITHUB_TOKEN=${{ github.token }} xvfb-run -a -s "-screen 0 1280x1024x24" java -jar .build/autosourcarr-source-host.jar > probe/source-host-run.log 2>&1 &
              for i in $(seq 1 90); do curl -sf http://127.0.0.1:4567/v1/health > probe/source-host-health.json && break; sleep 2; done
              GITHUB_TOKEN=${{ github.token }} python3 scripts/source-host-check.py --pkgs "${SOURCE_HOST_PKGS:-eu.kanade.tachiyomi.extension.all.mangadex,eu.kanade.tachiyomi.extension.en.mangapill,eu.kanade.tachiyomi.extension.en.weebcentral,eu.kanade.tachiyomi.extension.en.mangatown,eu.kanade.tachiyomi.extension.all.webtoons,eu.kanade.tachiyomi.extension.all.mangaplus,eu.kanade.tachiyomi.extension.en.mangakakalot,eu.kanade.tachiyomi.extension.en.mangabuddy,eu.kanade.tachiyomi.extension.en.mangahere,eu.kanade.tachiyomi.extension.en.mangafox,eu.kanade.tachiyomi.extension.en.asurascans,eu.kanade.tachiyomi.extension.en.flamecomics,eu.kanade.tachiyomi.extension.en.mangago}" --require 10 --lib14 \
                --cloudflare-url https://www.kakamanga.com/ --challenge-url http://127.0.0.1:8899/ > probe/source-host-check.txt 2>&1; hc=$?
              kill %1 2>/dev/null; sleep 2
              tail -c 20000 probe/source-host-run.log > probe/source-host-run.tail.log
              grep -v " DEBUG " probe/source-host-run.log | grep -A45 -E "VerifyError|WARN|ERROR|WebView|Cloudflare|CEF|Chromium" | head -400 > probe/source-host-warnings.log || true
              rm -f probe/source-host-run.log
              if [ "$b" = 0 ]; then
                AUTOSOURCARR_TEST_SOURCE_HOST_JAR=$PWD/.build/autosourcarr-source-host.jar AUTOSOURCARR_REQUIRE_SOURCE_HOST=1 \
                  timeout 900 dotnet run --project tests/AutoSourcarr.Tests -c Release --no-build -- --filter "source host:" > probe/source-host-csharp.log 2>&1; hcs=$?
                tail -c 30000 probe/source-host-csharp.log > probe/source-host-csharp.tail.log; rm -f probe/source-host-csharp.log
              fi
            fi
          fi
          # Phase 13: the 0.5.0 image (docker/Dockerfile, no push), boot time (PERF-7) and Playwright against it (PIPE-5).
          ib=skipped; boot=none; ipw=skipped
          if [ -f docker/Dockerfile ] && [ "$h" = 0 ] && [ "$rx" = 0 ]; then
            mkdir -p .build/source-host-out && cp .build/autosourcarr-source-host.jar .build/source-host-out/
            start_build=$(date +%s)
            timeout 3600 docker buildx build -f docker/Dockerfile \
              --build-context source-host=.build/source-host-out \
              --build-context reader-extension=.build/reader-extension \
              --build-arg VERSION="$(tr -d '\r\n' < VERSION)" --build-arg REVISION="$sha" \
              --load -t autosourcarr:probe . > probe/image-build.log 2>&1; ib=$?
            {
              echo "result=$ib"; echo "seconds=$(( $(date +%s) - start_build ))"
              docker image inspect -f 'size_bytes={{.Size}}' autosourcarr:probe 2>/dev/null
              docker run --rm --entrypoint sh autosourcarr:probe -c 'cat /opt/source-host/aot/status.txt; echo "jlink: $(cat /opt/source-jre/autosourcarr-modules.txt)"; ls -l /opt/autosourcarr-native /app/reader-extension; id' 2>&1
              echo "--- build log (errors and last lines)"
              grep -E "ERROR|error:|failed|UNSIGNED|AOT cache|jlink modules" probe/image-build.log | head -60
              tail -n 60 probe/image-build.log
            } > probe/image-build.txt 2>&1
            rm -f probe/image-build.log
            if [ "$ib" = 0 ]; then
              bash scripts/image-boot-check.sh autosourcarr:probe probe/boot-time.txt 18282 autosourcarr-probe > /dev/null 2>&1
              boot=$(grep -o '^ready_seconds=.*' probe/boot-time.txt | cut -d= -f2)
              if grep -q '^result=pass' probe/boot-time.txt; then
                node scripts/image-e2e-prepare.mjs http://127.0.0.1:18282 tests/e2e/fixtures/owner.json > probe/image-playwright.log 2>&1; prep=$?
                ipw=$prep
                if [ "$prep" = 0 ]; then
                  # Official Playwright image, pinned like release.yml; node_modules comes from the npm ci above.
                  timeout 2700 docker run --rm --network host --ipc=host -v "$PWD:/work" -w /work -e CI=1 \
                    -e E2E_BASE_URL=http://127.0.0.1:18282 -e E2E_SCREENSHOT_DIR=/work/.build/image-screenshots \
                    -e E2E_JSON=/work/test-results/playwright-image.json -e E2E_THEMES="${E2E_IMAGE_THEMES:-}" \
                    mcr.microsoft.com/playwright:v1.64.1-jammy@sha256:a3966b653e8d48a30901889081b616307fca73e0d843a117fadf6609397dac38 \
                    npx playwright test >> probe/image-playwright.log 2>&1; ipw=$?
                  sudo chown -R "$(id -u):$(id -g)" . 2>/dev/null || true
                fi
                { node scripts/playwright-summary.mjs test-results/playwright-image.json 2>&1
                  echo "screenshots=$(find .build/image-screenshots -name '*.png' 2>/dev/null | wc -l)"
                  node scripts/screenshot-diff.mjs "" .build/image-screenshots 2>&1
                  echo "--- log tail"; tail -c 20000 probe/image-playwright.log; } > probe/image-playwright.txt
                rm -f probe/image-playwright.log
              fi
              docker rm -f autosourcarr-probe > /dev/null 2>&1 || true
            fi
            node autosourcarr/tests/ui_v050_theme_contrast.js > probe/contrast.txt 2>&1
          fi
          # Mihon backup-format watch (phase 9, PIPE-9).
          GITHUB_TOKEN=${{ github.token }} python3 scripts/mihon-backup-watch.py > probe/mihon-backup-watch.txt 2>&1; echo "exit=$?" >> probe/mihon-backup-watch.txt
          # Repair runner isolation (phase 6e).
          { uname -r; python3 -c 'import ctypes; print("landlock abi", ctypes.CDLL(None).syscall(444, None, 0, 1))'; cat /proc/sys/kernel/yama/ptrace_scope; bash scripts/repair-runner-check.sh; echo "exit=$?"; } > probe/repair-runner-check.txt 2>&1
          rr=$(grep -o 'exit=[0-9]*' probe/repair-runner-check.txt | tail -1)
          printf 'sha=%s\nrestore=%s\nbuild=%s\ntest=%s\nopenapi=%s\nclient=%s\nsource_host_build=%s\nsource_host_check=%s\nsource_host_csharp=%s\nrepair_runner=%s\nkavita=%s\nreader_extension_build=%s\nplaywright=%s\nplaywright_bundle=%s\nui_bundle=%s\nimage_build=%s\nboot_seconds=%s\nimage_playwright=%s\n' "$sha" "$r" "$b" "$t" "$o" "$c" "$h" "$hc" "$hcs" "$rr" "$kv" "$rx" "$pw" "$pwb" "$ub" "$ib" "$boot" "$ipw" > probe/result.txt
          cat probe/result.txt
      - name: Commit results
        if: always()
        run: |
          git config user.name "probe"; git config user.email "probe@users.noreply.github.com"
          git add -f probe api docs/settings.md autosourcarr/app/static/generated $(find src tests -name packages.lock.json)
          git commit -q -m "probe results [skip ci]" || true
          git push -q origin HEAD:ci-probe || true
