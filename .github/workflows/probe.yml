name: probe

# Scratch compile/test probe for the ci-probe branch only. Every step tolerates failure and the job
# always succeeds (so GitHub sends no failure mail); results are committed back under probe/.
on:
  push:
    branches: [ci-probe]
    paths-ignore: ['probe/**']

permissions:
  contents: write

concurrency:
  group: probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: autosourcarr
          POSTGRES_PASSWORD: autosourcarr
          POSTGRES_DB: autosourcarr
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U autosourcarr"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      AUTOSOURCARR_TEST_POSTGRES: postgres://autosourcarr:autosourcarr@localhost:5432/autosourcarr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-source-host-${{ hashFiles('source-host/build.gradle.kts', 'scripts/build-source-host.sh') }}
          restore-keys: gradle-source-host-
      - name: Probe
        continue-on-error: true
        env:
          AUTOSOURCARR_TEST_ROOT: ${{ runner.temp }}/autosourcarr-tests
        run: |
          set +e
          mkdir -p probe
          sha=$(git rev-parse HEAD)
          dotnet restore AutoSourcarr.slnx > probe/restore.log 2>&1; r=$?
          dotnet build AutoSourcarr.slnx -c Release --no-restore > probe/build.log 2>&1; b=$?
          grep -E "error [A-Z]+[0-9]+|warning [A-Z]+[0-9]+" probe/build.log | sed 's#/home/runner/work/autosourcarr/autosourcarr/##' | sort -u > probe/build-errors.txt
          t=skipped; o=skipped; c=skipped
          if [ $b -eq 0 ]; then
            command -v nginx >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q nginx-light; } > probe/nginx.log 2>&1
            nginx -v >> probe/nginx.log 2>&1
            AUTOSOURCARR_REQUIRE_NGINX=1 dotnet run --project tests/AutoSourcarr.Tests -c Release --no-build > probe/test.log 2>&1; t=$?
            grep -E "^FAIL " -A 25 probe/test.log > probe/test-failures.txt
            tail -c 2000 probe/test.log | grep -o '"total":[0-9]*,"passed":[0-9]*,"failed":[0-9]*' > probe/test-summary.txt
            dotnet run --project tests/AutoSourcarr.Tests -c Release --no-build -- --write-openapi api/openapi.json > probe/openapi.log 2>&1; o=$?
            [ $o -eq 0 ] && { node scripts/generate-api-client.mjs >> probe/openapi.log 2>&1; c=$?; }
            dotnet run --project tests/AutoSourcarr.Tests -c Release --no-build -- --write-settings-docs docs/settings.md >> probe/openapi.log 2>&1
          fi
          # Source host (phase 4): build in a pinned Suwayomi checkout, start it, check real extensions.
          h=skipped; hc=skipped
          if [ -d source-host ]; then
            bash scripts/build-source-host.sh > probe/source-host-build.log 2>&1; h=$?
            tail -60 probe/source-host-build.log | grep -E "^e:|error:|FAIL|BUILD" > probe/source-host-errors.txt || true
            if [ $h -eq 0 ]; then
              export SOURCE_HOST_DATA=$RUNNER_TEMP/source-host-data SOURCE_HOST_PORT=4567
              java -jar .build/autosourcarr-source-host.jar > probe/source-host-run.log 2>&1 &
              for i in $(seq 1 90); do curl -sf http://127.0.0.1:4567/v1/health > probe/source-host-health.json && break; sleep 2; done
              python3 scripts/source-host-check.py --pkgs "${SOURCE_HOST_PKGS:-eu.kanade.tachiyomi.extension.all.mangadex,eu.kanade.tachiyomi.extension.en.mangapill,eu.kanade.tachiyomi.extension.en.weebcentral,eu.kanade.tachiyomi.extension.en.mangatown,eu.kanade.tachiyomi.extension.all.webtoons}" --require 1 > probe/source-host-check.txt 2>&1; hc=$?
              kill %1 2>/dev/null; sleep 2
              tail -c 20000 probe/source-host-run.log > probe/source-host-run.tail.log
              grep -v " DEBUG " probe/source-host-run.log | grep -A45 -E "VerifyError|WARN|ERROR" | head -400 > probe/source-host-warnings.log || true
              rm -f probe/source-host-run.log
              if [ "$b" = 0 ]; then
                AUTOSOURCARR_TEST_SOURCE_HOST_JAR=$PWD/.build/autosourcarr-source-host.jar AUTOSOURCARR_REQUIRE_SOURCE_HOST=1 \
                  timeout 900 dotnet run --project tests/AutoSourcarr.Tests -c Release --no-build -- --filter "source host:" > probe/source-host-csharp.log 2>&1; hcs=$?
                tail -c 30000 probe/source-host-csharp.log > probe/source-host-csharp.tail.log; rm -f probe/source-host-csharp.log
              fi
            fi
          fi
          printf 'sha=%s\nrestore=%s\nbuild=%s\ntest=%s\nopenapi=%s\nclient=%s\nsource_host_build=%s\nsource_host_check=%s\nsource_host_csharp=%s\n' "$sha" "$r" "$b" "$t" "$o" "$c" "$h" "$hc" "$hcs" > probe/result.txt
          cat probe/result.txt
      - name: Commit results
        if: always()
        run: |
          git config user.name "probe"; git config user.email "probe@users.noreply.github.com"
          git add -f probe api docs/settings.md autosourcarr/app/static/generated $(find src tests -name packages.lock.json)
          git commit -q -m "probe results [skip ci]" || true
          git push -q origin HEAD:ci-probe || true
